# TODO: cross-compile with cargo-zigbuild for musl targets, sign macOS
# binaries, publish crates.io in dependency order, generate SBOMs, publish
# GHCR image, update Homebrew tap.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # TODO: install `cargo-zigbuild` on Linux for musl targets and swap
      # `cargo build` for `cargo zigbuild`.
      - name: Build
        run: cargo build --release -p ailint-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          # TODO: real packaging (tar.gz for unix, zip for windows), checksums,
          # sigstore attestations.
          mkdir -p dist
          echo "packaging placeholder for ${{ matrix.target }}" > dist/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ailint-${{ matrix.target }}
          path: dist/

  publish-crates:
    name: publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # TODO: publish in dependency order: ailint-core → ailint-llm → ailint-cli
      # cargo publish -p ailint-core --token ${{ secrets.CRATES_IO_TOKEN }}
      # cargo publish -p ailint-llm  --token ${{ secrets.CRATES_IO_TOKEN }}
      # cargo publish -p ailint-cli  --token ${{ secrets.CRATES_IO_TOKEN }}
      - name: placeholder
        run: echo "TODO wire cargo publish"
