name: CI

# CI is the PR gate. It intentionally does NOT run on push to main:
#  - main is protected; merges come from PRs that already ran CI.
#  - The Release workflow runs the same validation before publishing.
# See RELEASING.md for the full release procedure.
on:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace --all-features
      - name: cargo build (slim CLI, no default features)
        run: cargo build -p ailint-cli --no-default-features
