[workspace]
resolver = "2"
members = [
    "crates/ailint-core",
    "crates/ailint-llm",
    "crates/ailint-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["ailint contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/OWNER/ailint"
homepage = "https://github.com/OWNER/ailint"
description = "Lint and inspect AI agent guidance files (CLAUDE.md, AGENTS.md, Copilot instructions, Cursor rules, and more)."
readme = "README.md"
keywords = ["ai", "lint", "cli", "agents", "prompt"]
categories = ["command-line-utilities", "development-tools"]

# TODO: pin exact versions once we've validated the API surface we depend on.
[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive", "env"] }
walkdir = "2"
ignore = "0.4"
pulldown-cmark = { version = "0.10", default-features = false }
colored = "2"
glob = "0.3"
regex = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Internal crates
ailint-core = { path = "crates/ailint-core", version = "0.1.0" }
ailint-llm  = { path = "crates/ailint-llm",  version = "0.1.0" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
# TODO: revisit opt-level / panic strategy before 1.0
