[workspace]
resolver = "2"
members = [
    "crates/ailint-core",
    "crates/ailint-extractor",
    "crates/ailint-llm",
    "crates/ailint-cli",
]

[workspace.package]
version = "1.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["ailint contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/jamesmhall/ailint"
homepage = "https://github.com/jamesmhall/ailint"
description = "Lint and inspect AI agent guidance files (CLAUDE.md, AGENTS.md, Copilot instructions, Cursor rules, and more)."
readme = "README.md"
keywords = ["ai", "lint", "cli", "agents", "prompt"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
aho-corasick = "1"
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
clap = { version = "4.5", features = ["derive", "env"] }
ignore = "0.4"
pulldown-cmark = { version = "0.10", default-features = false }
colored = "2.1"
glob = "0.3"
regex = "1.10"
schemars = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-segmentation = "1"
logos = "0.14"

# Internal crates
ailint-core = { path = "crates/ailint-core", version = "1.1.0" }
ailint-llm  = { path = "crates/ailint-llm",  version = "1.1.0" }
ailint-extractor = { path = "crates/ailint-extractor", version = "1.1.0" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
