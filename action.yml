name: ailint
description: Lint AI agent guidance files (CLAUDE.md, AGENTS.md, Copilot instructions, Cursor rules, ...).
author: ailint contributors
branding:
  icon: check-square
  color: purple

inputs:
  path:
    description: Path to lint.
    required: false
    default: "."
  format:
    description: Output format (terminal | json | sarif | markdown).
    required: false
    default: sarif
  output:
    description: File to write results to.
    required: false
    default: ailint-report.sarif
  config:
    description: Path to .ailint.yaml.
    required: false
  fail-on:
    description: Minimum severity that causes a non-zero exit (error | warning).
    required: false
    default: error
  llm-provider:
    description: LLM provider for opt-in AI rules (openai | anthropic | google | ollama | compatible).
    required: false
  llm-api-key:
    description: API key for the LLM provider.
    required: false
  version:
    description: "ailint version to install (default: latest)."
    required: false
    default: latest

outputs:
  report:
    description: Path to the generated report file.
    value: ${{ inputs.output }}

runs:
  using: composite
  steps:
    - name: Install ailint
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        VER="${VERSION}"
        if [ "$VER" = "latest" ]; then
          VER=$(curl -sSL https://api.github.com/repos/jamesmhall/ailint/releases/latest \
            | grep -oE '"tag_name":\s*"[^"]+"' \
            | head -n1 \
            | sed -E 's/.*"([^"]+)".*/\1/')
        fi
        case "${RUNNER_OS}" in
          Linux)
            TARGET=x86_64-unknown-linux-musl
            EXT=tar.gz
            ;;
          macOS)
            if [ "$(uname -m)" = "arm64" ]; then
              TARGET=aarch64-apple-darwin
            else
              TARGET=x86_64-apple-darwin
            fi
            EXT=tar.gz
            ;;
          Windows)
            TARGET=x86_64-pc-windows-msvc
            EXT=zip
            ;;
          *)
            echo "unsupported runner OS: ${RUNNER_OS}" >&2
            exit 1
            ;;
        esac
        ASSET="ailint-${VER}-${TARGET}.${EXT}"
        URL="https://github.com/jamesmhall/ailint/releases/download/${VER}/${ASSET}"
        DEST="${RUNNER_TEMP}/ailint"
        mkdir -p "${DEST}"
        cd "${DEST}"
        curl -sSL -o "${ASSET}" "${URL}"
        curl -sSL -o "${ASSET}.sha256" "${URL}.sha256"
        if command -v sha256sum >/dev/null 2>&1; then
          sha256sum -c "${ASSET}.sha256"
        else
          shasum -a 256 -c "${ASSET}.sha256"
        fi
        if [ "${EXT}" = "zip" ]; then
          unzip -o "${ASSET}"
        else
          tar -xzf "${ASSET}"
        fi
        chmod +x ailint 2>/dev/null || true
        echo "${DEST}" >> "${GITHUB_PATH}"
    - name: Run ailint
      shell: bash
      env:
        AILINT_LLM_API_KEY: ${{ inputs.llm-api-key }}
      run: |
        set -euo pipefail
        args=(check "${{ inputs.path }}" --format "${{ inputs.format }}" --output "${{ inputs.output }}")
        if [ -n "${{ inputs.config }}" ]; then
          args+=(--config "${{ inputs.config }}")
        fi
        if [ -n "${{ inputs.llm-provider }}" ]; then
          args+=(--llm-provider "${{ inputs.llm-provider }}")
        fi
        ailint "${args[@]}"
