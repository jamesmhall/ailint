[package]
name = "ailint-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The `ailint` CLI: lint AI agent guidance files."
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

# Binary is named `ailint` even though the crate is `ailint-cli`.
[[bin]]
name = "ailint"
path = "src/main.rs"

[dependencies]
ailint-core.workspace = true
ailint-llm = { workspace = true, optional = true }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tokio = { workspace = true, optional = true }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }

[features]
default = ["llm"]
llm = ["dep:ailint-llm", "dep:tokio"]

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
